<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project - Responsive Design</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Mi Galería Responsiva</h1>
    <p>Este es mi proyecto final de Diseño Responsivo. Aquí comparto nueve fotografías que me inspiran: naturaleza, animales y momentos tranquilos. Este sitio se adapta a celular, tableta y computadora, y también respeta si prefieres menos movimiento o modo oscuro.</p>
  </header>

  <main>
    <div class="grid">
      <figure>
        <img src="https://picsum.photos/id/1015/600/400" alt="Río entre montañas">
        <figcaption>Río entre montañas</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1016/600/400" alt="Cañón con río">
        <figcaption>Cañón con río</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1018/600/400" alt="Montaña con lago">
        <figcaption>Montaña con lago</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1025/600/400" alt="Perro pug en el campo">
        <figcaption>Perro pug en el campo</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1035/600/400" alt="Montañas con nieve">
        <figcaption>Montañas con nieve</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1039/600/400" alt="Cascada en el bosque">
        <figcaption>Cascada en el bosque</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1043/600/400" alt="Bosque con niebla">
        <figcaption>Bosque con niebla</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1050/600/400" alt="Bombillos colgando">
        <figcaption>Bombillos colgando</figcaption>
      </figure>
      <figure>
        <img src="https://picsum.photos/id/1060/600/400" alt="Café sobre la mesa">
        <figcaption>Café sobre la mesa</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p><a href="#top">Volver arriba</a></p>
  </footer>

</body>
</html>
